[package]
name = "oneprompt"
version = "0.1.0-alpha.6"
edition = "2024"
authors = ["Subhash Jha <subhashjha.mail@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/jhasubhash/oneprompt"
description = "A GPU terminal that treats the background and fonts as first-class design surfaces"

[dependencies]
alacritty_terminal = "0.26"
arboard = { version = "3", default-features = false }
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
muda = { version = "0.21", default-features = false }
png = "0.18"
# The poller alacritty_terminal's PTY traits name (marks.rs wraps the PTY).
polling = "3"
pollster = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.25"
wgpu = "30"
winit = "0.30"

# Tag the Metal layer's colour space explicitly (see Renderer::tag_srgb).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3", features = ["CGColorSpace"] }
# The file browser moves files to the Trash the Finder's way (browser.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-core-graphics"] }
